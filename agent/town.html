<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miw's Town</title>
<meta name="miw-token" content="__MIW_TOKEN__">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="town.css">
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div class="panel" id="hud">
  <div class="brand">
    <div class="logo">🥨</div>
    <div><h1>Miw's Town</h1><p>Where your AI agents live and work</p></div>
    <span class="live" id="mode"><i></i>…</span>
  </div>
  <div class="stats">
    <div class="stat" style="--c:#7cc68a"><b id="nWork">0</b><span>Working</span></div>
    <div class="stat" style="--c:#f6c35b"><b id="nIdle">0</b><span>Resting</span></div>
    <div class="stat" style="--c:#f07878"><b id="nErr">0</b><span>Stuck</span></div>
    <div class="stat" style="--c:#ffb3c8"><b id="xpTotal">0</b><span>XP</span></div>
  </div>
  <details id="guide" open>
    <summary>Where do they go?</summary>
    <div class="rows" id="rows"></div>
  </details>
</div>
<div class="panel" id="tools">
  <span id="clock"></span>
  <button id="tNames" aria-pressed="true">🏷️<span class="txt">Names</span></button>
  <button id="tBubbles" aria-pressed="true">💬<span class="txt">Bubbles</span></button>
  <button id="tPlaces" aria-pressed="true">🏠<span class="txt">Places</span></button>
  <button id="tCam">🎥<span class="txt">Reset view</span></button>
  <a href="room.html">🥨<span class="txt">Cat room</span></a>
  <a href="../game/game.html">🍰<span class="txt">Cheesecake Rush</span></a>
</div>
<div class="panel" id="dock"><h2>Mumie <span>tap a friend to chat, pet or restyle</span></h2><div class="chips" id="chips"></div></div>
<div class="panel" id="picker" hidden>
  <div class="ph"><div><b id="pkTitle">Choose a look</b><small>Pick who shows up in Miw's Town</small></div><button id="pkClose" aria-label="Close">✕</button></div>
  <div class="opts" id="pkOpts"></div>
  <label class="all"><input type="checkbox" id="pkAll"> Use this look for everyone</label>
</div>

<script src="../shared/vendor/three.min.js"></script>
<script src="../shared/vendor/OrbitControls.js"></script>
<script src="../shared/vendor/GLTFLoader.js"></script>
<script src="../shared/scenery.js"></script>
<script src="../shared/models.js"></script>
<script src="town.js"></script>
<script src="../shared/wear.js"></script>
<script src="panel.js"></script>
</body>
</html>
