<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cheesecake Rush</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="scene"></div><div id="vig"></div><div id="tsT" class="ts"></div><div id="tsB" class="ts"></div>
<div id="labels"></div>

<div id="top">
  <div id="day" class="card"><b><span id="dayName">Day 1</span><span id="coins">0 / 50 🪙</span></b><div id="bar"><i></i></div></div>
  <div id="clock" class="card">⏱ <span id="time">1:30</span> <small id="clockNote"></small></div>
  <div id="right">
    <div id="berry" class="card">🍓 6</div>
    <div id="combo" class="card"></div>
    <button id="shopHud" class="ibtn" title="Shop">🛍</button>
    <button id="mute" class="ibtn" title="Sound">🔊</button>
    <a href="../agent/town.html" class="ibtn townlink" title="Back to the town">🥨</a>
  </div>
</div>

<div id="stockTab" class="card"></div>
<div id="prepBar" hidden><button class="alt" id="prepKitchen">🍳 Kitchen</button><button class="go" id="prepOpen">Open the shop ▶</button></div>
<div id="camctl"><button data-cam="left" title="Turn left">↺</button><button data-cam="right" title="Turn right">↻</button><button data-cam="in" title="Zoom in">＋</button><button data-cam="out" title="Zoom out">－</button><button data-cam="reset" title="Reset the view">⌂</button></div>
<div id="hands" class="card"><small>HANDS</small><button class="slot" data-i="0"></button><button class="slot" data-i="1"></button><button class="slot" data-i="2"></button><button class="slot" data-i="3"></button></div>
<div id="pay" class="card" hidden>
  <div class="lcd">
    <div class="lrow"><span>🧾 BILL</span><b id="lBill">0</b></div>
    <div class="lrow"><span id="lWho">PAID</span><b id="lPaid">0</b></div>
    <div class="lrow big" id="lInRow"><span>CHANGE</span><b id="lIn">0</b></div>
    <div class="lrec" id="payReceipt"></div>
    <div class="lmsg" id="payMsg"></div>
  </div>
  <div class="keys" id="payKeys">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="C" class="op">C</button><button data-k="0">0</button><button data-k="B" class="op">⌫</button>
  </div>
  <div class="acts"><button class="alt" id="payX">later</button><button class="go" id="payOk">Enter ✓</button></div>
</div>
<div id="toast" class="card"></div>
<div id="overlay"><div id="panel" class="card"></div></div>

<script src="../shared/vendor/three.min.js"></script>
<script src="../shared/vendor/GLTFLoader.js"></script>
<script src="../shared/scenery.js"></script>
<script src="../shared/models.js"></script>
<script src="game.js"></script>
<script src="kitchen.js"></script>
<script src="decor.js"></script>
<script src="days.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="home.js"></script>
</body>
</html>
