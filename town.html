<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miw's Town</title>
<meta name="miw-token" content="__MIW_TOKEN__">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4b3442;--soft:#8c6f7f;--glass:rgba(255,255,255,.8);--line:rgba(75,52,66,.10);--bg:#fbe3ea;--accent:#ff7ea6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',system-ui,sans-serif;color:var(--ink)}
#scene{position:fixed;inset:0}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.panel{position:fixed;background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:20px;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 10px 30px rgba(160,80,115,.16),0 1px 0 rgba(255,255,255,.8) inset}
h1,h2,.fred{font-family:'Fredoka',sans-serif}
/* top-left: brand + stats */
#hud{top:16px;left:16px;padding:14px;width:min(340px,calc(100vw - 32px))}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,#ffb3c8,#ffd6a5 60%,#fff1b0);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 4px 10px rgba(255,126,166,.3)}
.brand h1{font-weight:600;font-size:22px;margin:0;line-height:1.05;letter-spacing:.2px}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--soft)}
.live{margin-left:auto;align-self:flex-start;display:flex;align-items:center;gap:6px;font-family:'Fredoka';font-size:11px;font-weight:600;letter-spacing:.8px;padding:4px 9px;border-radius:99px;background:#dcf6e2;color:#2f7a45}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.live.demo{background:#fff1c9;color:#9a6c06}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:#fff;border-radius:14px;padding:8px 4px 7px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-family:'Fredoka';font-weight:600;font-size:20px;line-height:1.1}
.stat span{font-size:11px;color:var(--soft);display:flex;align-items:center;justify-content:center;gap:4px}
.stat span::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c)}
/* guide */
#guide{margin-top:12px;border-top:1px dashed rgba(75,52,66,.15);padding-top:10px}
#guide summary{cursor:pointer;font-family:'Fredoka';font-weight:500;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
#guide summary::-webkit-details-marker{display:none}
#guide summary::after{content:'▾';color:var(--soft);transition:transform .2s}
#guide:not([open]) summary::after{transform:rotate(-90deg)}
.rows{display:grid;gap:4px;margin-top:8px}
.row{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;padding:5px 6px;border-radius:12px;transition:background .2s}
.row:hover{background:rgba(255,255,255,.7)}
.row .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--c)}
.row b{font-size:13px;font-weight:700;display:block;line-height:1.2}
.row small{font-size:11.5px;color:var(--soft);line-height:1.25;display:block}
.row .n{float:right;font-family:'Fredoka';font-size:11px;background:#fff;border-radius:99px;padding:0 7px;color:var(--soft)}
/* top-right tools */
#tools{top:16px;right:16px;display:flex;gap:4px;padding:5px;border-radius:16px}
#tools button,#tools a{font:600 13px 'Nunito';color:var(--ink);background:transparent;border:0;border-radius:11px;padding:7px 12px;cursor:pointer;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background .15s}
#tools button:hover,#tools a:hover{background:rgba(255,255,255,.9)}
#tools button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(160,80,115,.15)}
#tools button[aria-pressed="false"]{color:var(--soft)}
#clock{font-family:'Fredoka';font-size:13px;padding:7px 10px;color:var(--soft)}
/* bottom dock */
#dock{bottom:16px;left:50%;transform:translateX(-50%);padding:10px 12px 12px;max-width:calc(100vw - 32px)}
#dock h2{font-size:16px;font-weight:600;margin:0 2px 8px;display:flex;align-items:baseline;gap:8px}
#dock h2 span{font:400 12px 'Nunito';color:var(--soft)}
[hidden]{display:none!important}
.chip{cursor:pointer;font:inherit;color:inherit;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s}
.chip:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(160,80,115,.15);border-color:#ffc4d6}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,126,166,.18)}
#picker{bottom:150px;left:50%;transform:translateX(-50%);padding:14px 16px 12px;width:min(380px,calc(100vw - 32px));animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px) scale(.97)}to{opacity:1;transform:translate(-50%,0)}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ph b{font:600 16px 'Fredoka';display:block}
.ph small{font-size:12px;color:var(--soft)}
.ph button{border:0;background:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--soft);font-size:13px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{font:600 12.5px 'Nunito';color:var(--ink);background:#fff;border:2px solid transparent;border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .15s,border-color .15s}
.opt span{font-size:30px;line-height:1.1;transition:transform .2s}
.opt:hover span{transform:scale(1.15) rotate(-6deg)}
.opt.on{border-color:var(--accent);background:#fff5f8}
.all{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--soft);margin-top:12px;cursor:pointer}
.all input{accent-color:#ff7ea6}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;min-width:180px;max-width:240px;flex:none}
.chip .face{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:16px;position:relative}
.chip .face::after{content:'';position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--s);border:2px solid #fff}
.chip b{font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b em{font:600 10px 'Fredoka';font-style:normal;background:#fff0c2;color:#9a6c06;border-radius:6px;padding:1px 5px}
.chip small{font-size:12px;color:var(--soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{font-size:13px;color:var(--soft);padding:2px 4px}
/* in-world labels */
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.place{font:500 12.5px 'Fredoka';background:rgba(255,255,255,.92);border-radius:99px;padding:4px 11px 4px 6px;box-shadow:0 4px 12px rgba(160,80,115,.18);display:flex;gap:6px;align-items:center}
.place i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--c)}
.tag{font:600 11px 'Nunito';background:rgba(75,52,66,.82);color:#fff;border-radius:99px;padding:2px 8px}
.tag em{font:600 10px 'Fredoka';font-style:normal;color:#ffe08a;margin-left:5px}
.bubble{font:600 12.5px 'Nunito';background:#fff;border:2px solid var(--s);border-radius:14px;padding:4px 11px;max-width:230px;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s;box-shadow:0 4px 12px rgba(160,80,115,.18)}
.bubble::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--s);border-bottom:0}
.hide-names .tag,.hide-bubbles .bubble{display:none}
@media (max-width:760px){#tools{top:auto;bottom:118px;right:16px}#tools .txt{display:none}#guide{display:none}}
</style>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div class="panel" id="hud">
  <div class="brand">
    <div class="logo">🥨</div>
    <div><h1>Miw's Town</h1><p>Where your AI agents live and work</p></div>
    <span class="live" id="mode"><i></i>…</span>
  </div>
  <div class="stats">
    <div class="stat" style="--c:#7cc68a"><b id="nWork">0</b><span>Working</span></div>
    <div class="stat" style="--c:#f6c35b"><b id="nIdle">0</b><span>Resting</span></div>
    <div class="stat" style="--c:#f07878"><b id="nErr">0</b><span>Stuck</span></div>
    <div class="stat" style="--c:#ffb3c8"><b id="xpTotal">0</b><span>XP</span></div>
  </div>
  <details id="guide" open>
    <summary>Where do they go?</summary>
    <div class="rows" id="rows"></div>
  </details>
</div>
<div class="panel" id="tools">
  <span id="clock"></span>
  <button id="tNames" aria-pressed="true">🏷️<span class="txt">Names</span></button>
  <button id="tBubbles" aria-pressed="true">💬<span class="txt">Bubbles</span></button>
  <button id="tCam">🎥<span class="txt">Reset view</span></button>
  <a href="room">🥨<span class="txt">Cat room</span></a>
</div>
<div class="panel" id="dock"><h2>Mumie <span>tap a friend to chat, pet or restyle</span></h2><div class="chips" id="chips"></div></div>
<div class="panel" id="picker" hidden>
  <div class="ph"><div><b id="pkTitle">Choose a look</b><small>Pick who shows up in Miw's Town</small></div><button id="pkClose" aria-label="Close">✕</button></div>
  <div class="opts" id="pkOpts"></div>
  <label class="all"><input type="checkbox" id="pkAll"> Use this look for everyone</label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="scenery.js"></script>
<script src="models.js"></script>
<script>
const $ = id => document.getElementById(id);
const PI = Math.PI;

// ---------- renderer / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const VIEW = 27;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const CENTER = new THREE.Vector3(3.5, 0, 2);
const CAM_HOME = CENTER.clone().add(new THREE.Vector3(22, 19, 22));
camera.position.copy(CAM_HOME);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minPolarAngle = 0.55; controls.maxPolarAngle = 1.15;
controls.minZoom = 0.7; controls.maxZoom = 2.6;
controls.target.copy(CENTER);

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  const v = Math.max(VIEW, 38 / a);
  camera.left = -v * a / 2; camera.right = v * a / 2; camera.top = v / 2; camera.bottom = -v / 2;
  // on wide screens, center the island in the space right of the side panel
  const side = w >= 1200 ? 356 : 0;
  if (side) camera.setViewOffset(w, h, -side / 2, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', resize); resize();

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xfff4ea, 0xd9b0b4, 0.47);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e6, 0.56);
sun.position.set(13, 16, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.position.add(CENTER); sun.target.position.copy(CENTER); scene.add(sun.target);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 70 });
sun.shadow.radius = 3;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffeef2, 0.24);
fill.position.copy(CAM_HOME);
scene.add(fill);

// ---------- helpers ----------
const mats = {};
const M = (c, extra) => {
  const k = c + JSON.stringify(extra || {});
  return mats[k] || (mats[k] = new THREE.MeshLambertMaterial({ color: c, ...extra }));
};
function mesh(geo, color, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s, cast = true, recv = false, mat } = {}) {
  const m = new THREE.Mesh(geo, mat || M(color));
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  if (s) Array.isArray(s) ? m.scale.set(...s) : m.scale.setScalar(s);
  m.castShadow = cast; m.receiveShadow = recv;
  return m;
}
// soft, rounded-edge boxes everywhere (cached per size) so nothing looks sharp
const boxCache = {};
const box = (w, h, d) => {
  const r = Math.min(0.07, Math.min(w, h, d) * 0.25);
  if (r < 0.012) return new THREE.BoxGeometry(w, h, d);
  const key = [w, h, d].join(',');
  if (boxCache[key]) return boxCache[key];
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2 + r); s.lineTo(w / 2 - r, -h / 2 + r); s.lineTo(w / 2 - r, h / 2 - r); s.lineTo(-w / 2 + r, h / 2 - r);
  const geo = new THREE.ExtrudeGeometry(s, { depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r - 0.0001, bevelSegments: 3, curveSegments: 4 });
  geo.translate(0, 0, -(d - 2 * r) / 2);
  geo.computeVertexNormals();
  return (boxCache[key] = geo);
};
const sph = (r, seg = 20) => new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75));
const cyl = (rt, rb, h, seg = 20) => new THREE.CylinderGeometry(rt, rb, h, seg);
const cone = (r, h, seg = 20) => new THREE.ConeGeometry(r, h, seg);
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---------- island ----------
const A = 8.2, B = 6.2;                 // rainbow road ellipse radii
const pathPoint = th => new THREE.Vector3(A * Math.cos(th), 0.08, B * Math.sin(th));
const outward = th => new THREE.Vector3(Math.cos(th) / A, 0, Math.sin(th) / B).normalize();
const tangent = th => new THREE.Vector3(-A * Math.sin(th), 0, B * Math.cos(th));

// a floating island of golden pretzel dough, with pink icing round the rim
scene.add(mesh(cyl(1, 1, 1.4, 72), '#e7b07c', { y: -0.75, s: [14.2, 1, 11.6], cast: false, recv: true }));
scene.add(mesh(cyl(1, 1, 0.3, 72), '#f9cdd9', { y: -0.04, s: [14.6, 1, 12], cast: false, recv: true }));
scene.add(makeUnderside({ rx: 14.2, rz: 11.6, top: -1.45, depth: 12, seed: 3 }));
function icingRing(cx, cz, rx, rz, n, color) {
  for (let i = 0; i < n; i++) {
    const a = i / n * PI * 2, d = 0.25 + ((i * 37) % 11) / 11 * 0.6, x = cx + rx * Math.cos(a), z = cz + rz * Math.sin(a);
    scene.add(mesh(sph(0.17, 10), color, { x, y: -0.1 - d / 2, z, s: [0.8, d / 0.34, 0.8], cast: false }));
    scene.add(mesh(sph(0.12, 8), color, { x, y: -0.1 - d, z, cast: false }));
  }
}
icingRing(0, 0, 14.62, 12.02, 120, '#f9cdd9');
scene.add(mesh(cyl(1, 1, 0.3, 72), '#bfe5a8', { y: 0.0, s: [13.4, 1, 10.8], cast: false, recv: true }));

const RAINBOW = ['#ffb3c1', '#ffd6a5', '#fdf3a7', '#caffbf', '#a6ecf5', '#b5ccff', '#d3c4ff'];
const TILES = 64;
for (let i = 0; i < TILES; i++) {
  const th = i / TILES * PI * 2, p = pathPoint(th), t = tangent(th);
  scene.add(mesh(box(0.95, 0.12, 0.82), RAINBOW[i % RAINBOW.length], { x: p.x, y: 0.16, z: p.z, ry: -Math.atan2(t.z, t.x), cast: false, recv: true }));
}

// ---------- buildings (one per state) ----------
const PLACES = {
  idle:        { th: PI * 0.25, icon: '🏡', name: 'Cozy Cottage',   desc: 'Done, or waiting for you',        wall: '#fff3f6', roof: '#ff9fb5' },
  thinking:    { th: PI * 0.53, icon: '🔭', name: 'Thinking Tower', desc: 'Reading your prompt, planning',   wall: '#efe8ff', roof: '#b9a6f5' },
  writing:     { th: PI * 0.82, icon: '✏️', name: 'Writing Studio', desc: 'Editing and creating files',      wall: '#fff8e6', roof: '#ffc98a' },
  researching: { th: PI * 1.12, icon: '📚', name: 'Library',        desc: 'Reading, searching, browsing',    wall: '#eaf6ff', roof: '#8fc1f0' },
  executing:   { th: PI * 1.42, icon: '⚙️', name: 'Code Factory',   desc: 'Running commands and tests',      wall: '#eef7ea', roof: '#9fd49a' },
  syncing:     { th: PI * 1.70, icon: '📮', name: 'Post Office',    desc: 'Handing off to helpers and tools', wall: '#fffbe6', roof: '#f6d36b' },
  error:       { th: PI * 1.97, icon: '🐞', name: 'Bug Clinic',     desc: 'Something failed, needs a look',  wall: '#fff0ee', roof: '#f49a91' },
};
const STATE_LABEL = { idle: 'Resting', thinking: 'Thinking', writing: 'Writing', researching: 'Researching', executing: 'Running', syncing: 'Syncing', error: 'Stuck' };
const STATE_ICON = { idle: '💤', thinking: '💭', writing: '✏️', researching: '📚', executing: '⚙️', syncing: '📮', error: '🐞' };
const STATE_COLOR = { idle: '#f6c35b', thinking: '#b9a6f5', writing: '#ffb36b', researching: '#7fb8ee', executing: '#7cc68a', syncing: '#e8c547', error: '#f07878' };
const TINT = { idle: '#ffe3ea', thinking: '#ece5ff', writing: '#ffefd9', researching: '#e2f0ff', executing: '#e3f5e1', syncing: '#fff4c9', error: '#ffe1de' };

const windowMat = new THREE.MeshLambertMaterial({ color: '#cfe9ff', emissive: '#ffd27a', emissiveIntensity: 0 });
const animated = [];   // per-frame tweens for decor

// each building's shape says what happens inside; local +z faces the rainbow road
const glow = new THREE.MeshLambertMaterial({ color: '#fff6c8', emissive: '#ffe58a', emissiveIntensity: 0.55 });
function prism(w, h, d, color, opts) {
  // right-angled triangular prism (sawtooth roofs, envelope flaps)
  const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(w, 0); s.lineTo(0, h); s.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false });
  geo.translate(-w / 2, 0, -d / 2);
  return mesh(geo, color, opts);
}
function puffs(g, x, y, z, n = 4, period = 2600) {
  for (let i = 0; i < n; i++) {
    const puff = new THREE.Mesh(sph(0.2, 12), new THREE.MeshLambertMaterial({ color: '#ffffff', transparent: true }));
    g.add(puff);
    animated.push(t => { const k = ((t / period) + i / n) % 1; puff.position.set(x + Math.sin(k * 4 + i) * 0.2, y + k * 1.6, z); puff.scale.setScalar(0.5 + k * 1.2); puff.material.opacity = 0.9 * (1 - k); });
  }
}
function gear(r, teeth, color) {
  const g = new THREE.Group();
  g.add(mesh(cyl(r, r, 0.16, 24), color, { rx: PI / 2 }));
  g.add(mesh(cyl(r * 0.35, r * 0.35, 0.2, 16), '#ffffff', { rx: PI / 2, cast: false }));
  for (let i = 0; i < teeth; i++) { const a = i / teeth * PI * 2; g.add(mesh(box(r * 0.32, r * 0.32, 0.16), color, { x: Math.cos(a) * r, y: Math.sin(a) * r, rz: a })); }
  return g;
}

const BUILD = {
  // 🏡 a round mushroom cottage with a polka-dot cap, flower boxes and a picket fence
  idle(g) {
    g.add(mesh(cyl(1.6, 1.6, 0.14, 32), '#f7e3ea', { y: 0.07, recv: true }));
    g.add(mesh(cyl(1.05, 1.18, 1.55, 28), '#fff6e8', { y: 0.92, recv: true }));
    const cap = new THREE.Group(); cap.position.y = 1.62; g.add(cap);
    cap.updateMatrixWorld(true);
    cap.add(mesh(new THREE.SphereGeometry(1.6, 32, 16, 0, PI * 2, 0, PI / 2), '#ff8fab', { s: [1, 0.78, 1] }));
    cap.add(mesh(cyl(1.58, 1.4, 0.12, 32), '#ffe0e8', { y: 0.0 }));
    [[0.3, 0.55, 0.22], [1.4, 0.75, 0.2], [2.5, 0.5, 0.24], [3.6, 0.8, 0.18], [4.7, 0.6, 0.22], [5.6, 0.95, 0.16], [0.9, 1.1, 0.16], [3.0, 1.15, 0.15], [0, 0.05, 0.2]].forEach(([th, ph, r]) => {

// Miw: a little girl with orange braids, pink glasses and a yellow polka-dot dress

function setSpecies(me, species) {
  const old = me.cat, fresh = makeCharacter(species, me.color);
  fresh.g.position.copy(old.g.position); fresh.g.rotation.copy(old.g.rotation); fresh.g.scale.copy(old.g.scale);
  scene.remove(old.g); scene.add(fresh.g);
  me.cat = fresh; me.species = species;
}

// ---------- agents ----------
const agents = new Map();
// swap in each Blender-sculpted character as it arrives
Object.keys(SPECIES).forEach(sp => loadModel(sp, () => agents.forEach(me => me.species === sp && setSpecies(me, sp))));
const labels = $('labels');
const XP_KEY = 'agent-town-xp';
let xpStore = {};
try { xpStore = JSON.parse(localStorage.getItem(XP_KEY) || '{}'); } catch {}
const saveXp = () => { try { localStorage.setItem(XP_KEY, JSON.stringify(xpStore)); } catch {} };
let colorIdx = 0;

function upsert(a) {
  let me = agents.get(a.id);
  const state = PLACES[a.state] ? a.state : 'idle';
  if (!me) {
    const color = COLORS[colorIdx++ % COLORS.length], species = speciesOf(a.id);
    const cat = makeCharacter(species, color);
    const th = PLACES.idle.th + (Math.random() - 0.5) * 0.6;
    me = { id: a.id, cat, color, species, th, off: 0, at: null, state };
    const p = pathPoint(th); cat.g.position.copy(p); cat.g.scale.setScalar(0.001);
    scene.add(cat.g);
    me.tag = Object.assign(document.createElement('div'), { className: 'lbl tag' });
    me.bubble = Object.assign(document.createElement('div'), { className: 'lbl bubble' });
    labels.append(me.tag, me.bubble);
    agents.set(a.id, me);
    me.born = performance.now();
  }
  if (me.state !== state || me.msg !== a.msg) {
    me.changedAt = performance.now();
    if (me.state !== state || !xpStore[me.id]) { xpStore[me.id] = (xpStore[me.id] || 0) + (state === 'idle' ? 25 : 10); saveXp(); }
  }
  me.realName = a.name || a.id;
  me.name = (window.nickOf && nickOf(a.id)) || me.realName; me.state = state; me.msg = a.msg || '';
  me.history = a.history || []; me.sessionId = a.sessionId; me.cwd = a.cwd;
}
function removeMissing(ids) {
  for (const [id, me] of agents) if (!ids.has(id)) { scene.remove(me.cat.g); me.tag.remove(); me.bubble.remove(); agents.delete(id); }
}
const lvl = xp => 1 + Math.floor(Math.sqrt((xp || 0) / 20));

// resting agents split their time between the Cozy Cottage (0), the pool (1) and the café (2)
const SWIM_SPOTS = [[-0.7, -0.5], [0.7, 0.4], [0, 0.8], [-0.8, 0.5], [0.6, -0.7]].map(([dx, dz]) => [POOL.x + dx, POOL.z + dz]);
const isSwimmer = me => me.state === 'idle' && me.rest === 1;
const isCafe = me => me.state === 'idle' && me.rest === 2;
const restOf = me => me.state === 'idle' ? me.rest || 0 : -1;
function pickRest(me, different) {
  // nobody swims in the rain; the café is cosiest at night and when it's wet
  const night = darkness(hourNow()) > 0.5, wet = window.isRaining && isRaining();
  const pool = wet ? 0 : night ? 0.15 : 0.4, cafe = wet ? 0.45 : night ? 0.35 : 0.25;
  do { const r = Math.random(); me.rest = r < pool ? 1 : r < pool + cafe ? 2 : 0; } while (different && Math.random() < 0.85 && me.rest === me.prevRest);
  me.prevRest = me.rest;
}
function slotOf(me) {
  const same = [...agents.values()].filter(a => a.state === me.state && restOf(a) === restOf(me));
  return same.indexOf(me);
}
function angDiff(a, b) { let d = (b - a) % (PI * 2); if (d > PI) d -= PI * 2; if (d < -PI) d += PI * 2; return d; }
const goalTh = me => isSwimmer(me) ? POOL_TH : isCafe(me) ? CAFE_TH : PLACES[me.state].th;
// where the agent ends up once it steps off the road
function goalPoint(me) {
  const i = slotOf(me);
  if (isSwimmer(me)) { const [x, z] = SWIM_SPOTS[i % SWIM_SPOTS.length]; return new THREE.Vector3(x, 0, z); }
  const th = goalTh(me), off = [0, -0.95, 0.95, -1.9, 1.9, -2.85, 2.85][i % 7];
  // the café's terrace is on the inner side of the road
  return pathPoint(th).add(outward(th).multiplyScalar(isCafe(me) ? -1.15 : 1.1)).add(tangent(th).normalize().multiplyScalar(off));
}

function stepAgent(me, dt, t) {
  const { g, body, head, tail, feet } = me.cat;
  let walking = false;
  const born = Math.min(1, (performance.now() - me.born) / 500);
  g.scale.setScalar(CAT_SCALE * (born < 1 ? 0.2 + 0.8 * Math.sin(born * PI / 2) * (1 + Math.sin(born * PI) * 0.2) : 1));

  // a fresh rest spot whenever an agent starts resting, and a new one every so often
  if (me.state === 'idle' && me.restFor !== me.at && me.at !== 'idle') { pickRest(me); me.restFor = me.at; }

    if (me.off > 0 && (Math.abs(angDiff(me.th, goal)) > 0.01 || me.anchorSwim !== isSwimmer(me))) me.off = Math.max(0, me.off - dt * 2.4 / Math.max(1.1, me.anchorLen || 1.1));

        me.th = goal;

      }

    walking = true;
  }
  // heading in: aim at the new spot; heading out: back off from where we were
  if (!(me.off > 0 && (Math.abs(angDiff(me.th, goal)) > 0.01 || me.anchorSwim !== isSwimmer(me))) || !me.anchor) { me.anchor = goalPoint(me); me.anchorSwim = isSwimmer(me); me.anchorLen = me.anchor.distanceTo(pathPoint(goal)); }
  const pos = pathPoint(me.th).lerp(me.anchor, me.off);
  // swimmers walk up and over the arched bridge, cross the deck, then hop in
  const along = me.off * (me.anchorLen || 0);
  const swimming = me.anchorSwim && (1 - me.off) * me.anchorLen < 1.0;
  let y = 0.22;
  if (me.anchorSwim) {
    if (along > BRIDGE.s0 && along < BRIDGE.s1) y = 0.32 + BRIDGE.arch * Math.sin(PI * (along - BRIDGE.s0) / (BRIDGE.s1 - BRIDGE.s0));
    else if (along >= BRIDGE.s1) y = 0.32;
    if (swimming) y = -0.05 + Math.sin(t / 450 + me.th * 5) * 0.03;
  }
  me.py = me.py === undefined ? 0.22 : me.py + (y - me.py) * Math.min(1, dt * 6);
  g.position.set(pos.x, me.py, pos.z);
  // a happy hop right after being petted
  if (me.petAt) { const k = (performance.now() - me.petAt) / 600; if (k < 1) g.position.y += Math.sin(k * PI) * 0.6; }
  me.swimming = swimming && !walking;
  me.walking = walking;

  let face;

    const dir = me.off > 0 && Math.abs(angDiff(me.th, goal)) < 0.01 ? me.anchor.clone().sub(pathPoint(me.th)) : tangent(me.th).multiplyScalar(me.dir || 1);
    face = Math.atan2(dir.x, dir.z);
  } else face = Math.atan2(camera.position.x - pos.x, camera.position.z - pos.z) + (me.swimming ? Math.sin(t / 1800 + me.th) * 0.6 : 0);

    body.rotation.z = Math.sin(s * 12) * 0.08;

        else { body.scale.y = 1 + Math.sin(s * 2) * 0.03; head.rotation.z = 0.25; }
        break;
      case 'thinking': head.rotation.z = Math.sin(s * 1.5) * 0.2; head.rotation.x = -0.2; break;
      case 'writing': body.position.y = Math.abs(Math.sin(s * 14)) * 0.04; head.rotation.x = 0.25; break;
      case 'researching': head.rotation.x = 0.3; head.rotation.y = Math.sin(s * 0.8) * 0.3; break;
      case 'executing': body.position.y = Math.max(0, Math.sin(s * 7)) * 0.25; break;
      case 'syncing': body.rotation.y = s * 2; break;
      case 'error': body.position.x = Math.sin(s * 40) * 0.04; head.rotation.z = Math.sin(s * 3) * 0.15; break;
    }
  }
  if (me.state !== 'idle' || walking) body.scale.y = 1;
  tail.rotation.z = Math.sin(s * (walking || me.state !== 'idle' ? 8 : 2)) * 0.5;
  // Blender-sculpted characters play their own walk, idle and blink clips on top
  if (me.cat.pose) me.cat.pose(walking, dt);
}

// ---------- day / night (real clock, or ?hour=21) ----------
function hourNow() {
  const q = new URLSearchParams(location.search).get('hour');
  if (q !== null && q !== '' && !isNaN(+q)) return ((+q % 24) + 24) % 24;
  return bangkokHour();
}
// always Thai time, whatever time zone this computer is set to
function bangkokHour() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  const get = t => +parts.find(p => p.type === t).value;
  return get('hour') + get('minute') / 60;
}
function darkness(h) {
  if (h < 5 || h >= 19.5) return 1;
  if (h < 7) return 1 - (h - 5) / 2;
  if (h < 17) return 0;
  return (h - 17) / 2.5;
}
const C = c => new THREE.Color(c);
const SKY = { day: C('#f3cfdb'), dusk: C('#ffc6a8'), night: C('#2c2546'), wet: C('#c9c1cf'), wetNight: C('#262338'), flash: C('#f4f0ff') };
function applyTime(h, t) {
  const dk = darkness(h);
  // real Bangkok weather: grey skies and a softer sun when it's cloudy, lightning now and then in a storm
  const wet = window.wetness ? wetness() : 0;
  const flash = window.weather?.kind === 'storm' && t % 9000 < 140 ? 1 : 0;
  const sky = dk < 0.5 ? SKY.day.clone().lerp(SKY.dusk, dk * 2) : SKY.dusk.clone().lerp(SKY.night, (dk - 0.5) * 2);
  sky.lerp(dk > 0.5 ? SKY.wetNight : SKY.wet, wet * 0.45);
  if (flash) sky.lerp(SKY.flash, 0.5);
  scene.background = sky;
  document.documentElement.style.setProperty('--bg', '#' + sky.getHexString());
  hemi.intensity = (0.47 - dk * 0.15) * (1 - wet * 0.12) + flash * 0.35;
  hemi.color.set(dk > 0.5 ? '#c9c4ff' : '#fff4ea');
  fill.intensity = 0.24 - dk * 0.1;
  sun.intensity = (0.56 - dk * 0.3) * (1 - wet * 0.45);
  sun.color.set(dk > 0.2 && dk < 0.8 ? '#ffc39a' : dk >= 0.8 ? '#a9b4ff' : '#fff3e6');
  windowMat.emissiveIntensity = dk * 0.9;
  bulbMat.emissiveIntensity = dk;
  lampLights.forEach((L, i) => { L.intensity = dk * (1.1 + Math.sin(t / 300 + i) * 0.05); });
  starMat.opacity = Math.max(0, dk - 0.3) * 1.4;
  clouds.forEach(c => c.userData.mat.color.set(dk > 0.5 ? (wet ? '#6f6a8c' : '#8f88b8') : (wet ? '#e2dde8' : '#ffffff')));
  const dayIcon = dk > 0.5 ? '🌙' : dk > 0.1 ? '🌇' : '☀️';
  $('clock').textContent = `${window.weatherIcon ? weatherIcon(dayIcon) : dayIcon} ${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor(h % 1 * 60)).padStart(2, '0')}${window.weatherTemp ? weatherTemp() : ''}`;
}

// ---------- HUD ----------
function renderHud() {
  const list = [...agents.values()];
  $('nWork').textContent = list.filter(a => a.state !== 'idle' && a.state !== 'error').length;
  $('nIdle').textContent = list.filter(a => a.state === 'idle').length;
  $('nErr').textContent = list.filter(a => a.state === 'error').length;
  $('xpTotal').textContent = list.reduce((s, a) => s + (xpStore[a.id] || 0), 0).toLocaleString();
  Object.keys(PLACES).forEach(k => { const c = list.filter(a => a.state === k).length; rowEls[k].textContent = c ? c : ''; });
  const chips = $('chips');
  chips.innerHTML = '';
  if (!list.length) { chips.append(Object.assign(document.createElement('span'), { className: 'empty', textContent: 'Nobody home yet. Start a Claude Code session and a new friend will move in.' })); return; }
  for (const me of list) {
    const chip = Object.assign(document.createElement('button'), { className: 'chip' + (pickId === me.id ? ' sel' : ''), title: 'Open' });
    chip.onclick = () => (window.openAgent || openPicker)(me.id);
    const face = Object.assign(document.createElement('span'), { className: 'face', textContent: SPECIES[me.species].emoji });
    face.style.background = me.color; face.style.setProperty('--s', STATE_COLOR[me.state]);
    const info = document.createElement('div'); info.style.minWidth = '0';
    const b = Object.assign(document.createElement('b'), { textContent: me.name });
    b.append(Object.assign(document.createElement('em'), { textContent: 'Lv ' + lvl(xpStore[me.id]) }));
    info.append(b, Object.assign(document.createElement('small'), { textContent: STATE_LABEL[me.state] + (me.msg ? ' · ' + me.msg : '') }));
    if (window.timelineBar) info.append(timelineBar(me));
    chip.append(face, info); chips.append(chip);
  }
}
// ---------- look picker ----------
let pickId = null;
function openPicker(id) {
  const me = agents.get(id); if (!me) return;
  pickId = id;
  $('pkTitle').textContent = `Choose a look for ${me.name}`;
  const opts = $('pkOpts'); opts.innerHTML = '';
  Object.entries(SPECIES).forEach(([k, sp]) => {
    const b = Object.assign(document.createElement('button'), { className: 'opt' + (me.species === k ? ' on' : '') });
    b.append(Object.assign(document.createElement('span'), { textContent: sp.emoji }), sp.name);
    b.onclick = () => {
      if ($('pkAll').checked) {
        speciesStore = { _default: k };
        agents.forEach(a => { if (a.species !== k) setSpecies(a, k); });
      } else {
        speciesStore[id] = k;
        if (me.species !== k) setSpecies(me, k);
      }
      saveSpecies(); openPicker(id); renderHud();
    };
    opts.append(b);
  });
  $('picker').hidden = false;
  renderHud();
}
$('pkClose').onclick = () => { $('picker').hidden = true; pickId = null; renderHud(); };
// keep the town and the room in sync when a look changes in the other tab
addEventListener('storage', e => {
  if (e.key !== SPECIES_KEY) return;
  loadSpecies();
  agents.forEach(a => { const k = speciesOf(a.id); if (a.species !== k) setSpecies(a, k); });

});

function toggle(btn, cls) {
  btn.onclick = () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on);
    labels.classList.toggle(cls, !on);
  };
}
if (innerWidth < 1100 || innerHeight < 760) $('guide').open = false;
toggle($('tNames'), 'hide-names'); toggle($('tBubbles'), 'hide-bubbles');
$('tCam').onclick = () => { camera.position.copy(CAM_HOME); camera.zoom = 1; camera.updateProjectionMatrix(); controls.target.copy(CENTER); };

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  applyTime(hourNow(), t);
  animated.forEach(f => f(t));
  // clouds sway along the far (back) side of the island so they never cover buildings
  clouds.forEach(c => { const u = c.userData; u.a += u.sp * 16; const a = PI * 1.25 + Math.sin(u.a) * 0.75; c.position.set(CENTER.x + Math.cos(a) * u.r, u.y + Math.sin(t / 2000 + u.r) * 0.2, CENTER.z + Math.sin(a) * u.r * 0.8); });
  for (const me of agents.values()) stepAgent(me, dt, t);
  controls.update();
  renderer.render(scene, camera);
  drawLabels();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- data: live server, else demo ----------
let demo = false;
async function poll() {
  try {
    if (!location.protocol.startsWith('http')) throw new Error('file');
    const res = await fetch('state', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const list = await res.json();
    if (demo) { demo = false; removeMissing(new Set()); }
    list.forEach(upsert);
    removeMissing(new Set(list.map(a => a.id)));
    $('mode').innerHTML = '<i></i>LIVE'; $('mode').className = 'live';
    renderHud();
    setTimeout(poll, 1000);
  } catch { startDemo(); }
}
const DEMO_MSGS = {
  idle: ['Taking a nap', 'Waiting for you', 'All done ✨'],
  thinking: ['Thinking…', 'Making a plan'],
  writing: ['Editing App.tsx', 'Writing the README', 'Adding a new button'],
  researching: ['Reading api.ts', 'Browsing the web', 'Looking for the config'],
  executing: ['npm test', 'git status', 'Building…'],
  syncing: ['Handing off to a helper', 'Checking Slack'],
  error: ['Tests failed!', 'Oops, a 404', 'Help, please'],
};
function startDemo() {
  if (demo) return;
  demo = true;
  $('mode').innerHTML = '<i></i>DEMO'; $('mode').className = 'live demo';
  const names = ['Mochi', 'Bean', 'Peach', 'Bun', 'Sushi'], states = Object.keys(PLACES);
  names.forEach((n, i) => {
    const tick = () => {
      if (!demo) return;
      const st = states[Math.floor(Math.random() * states.length)], m = DEMO_MSGS[st];
      upsert({ id: 'demo' + i, name: n, state: st, msg: m[Math.floor(Math.random() * m.length)] });
      renderHud();
      setTimeout(tick, 5000 + Math.random() * 6000);
    };
    setTimeout(tick, i * 900);
  });
  const retry = async () => {
    try {
      if (!location.protocol.startsWith('http')) return;
      if ((await fetch('state', { cache: 'no-store' })).ok) { poll(); return; }
    } catch {}
    setTimeout(retry, 5000);
  };
  setTimeout(retry, 5000);
}
poll();
