<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheesecake Rush: promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #f4e4e8; display: grid; place-items: center; overflow: hidden; }
  #out { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
</style>
</head>
<body>
<canvas id="out" width="1080" height="1080"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="models.js"></script>
<script src="sound.js"></script>
<script>
// Cheesecake Rush: a 21.2 s promo, 1080x1080, 30 fps (636 frames), made the same way as the intro loop:
// window.renderAt(t) draws exactly time t, so every frame is the same every time.
//   1. Title        the shop and the giant cheesecake, Miw drops in and the desserts pop up round her
//   2. Bake         stir the bowl, bake in the oven, top the cake with strawberries, cut it into four
//   3. Serve        the friends order, Miw carries a tray round the tables
//   4. Cash up      a calculator: key in the change, press Enter, coins rain
//   5. End card     the friends hop one after another, then the title
// ?t=2.5 freezes on that frame; ?capture renders every frame to video/out/rush/; ?audio renders the soundtrack.
const PI = Math.PI, TAU = PI * 2;
const SIZE = 1080, FPS = 30;
const TL = { s1: [0, 3.2], s2: [3.2, 10.6], s3: [10.6, 14.6], s4: [14.6, 17.8], s5: [17.8, 21.2] };
const DUR = 21.2, FRAMES = Math.round(DUR * FPS);
const F1 = 1 / FPS;
const COLORS = { cat: '#f7a072', bunny: '#f49ac1', bear: '#c99a6e', frog: '#8cc97f', chick: '#f2c14e', penguin: '#8fb3ff', miw: '#ff6fae' };

// ---------- easing ----------
const clamp01 = x => Math.min(1, Math.max(0, x));
const seg = (u, a, b) => clamp01((u - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const inOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outQuad = x => 1 - (1 - x) * (1 - x);
const outBack = (x, c = 1.7) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
const hash = (k, j) => { const x = Math.sin(k * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); };
// damped spring from 0 to 1, settled after about 0.5 s
const spring = (s, zeta = 0.45, hz = 3.2) => s <= 0 ? 0 : 1 - Math.exp(-zeta * TAU * hz * s) * Math.cos(TAU * hz * Math.sqrt(1 - zeta * zeta) * s);
// appears with a springy pop at `a`, leaves with a quick shrink ending at `b`
const popSpan = (t, a, b) => Math.max(0, spring(t - a, 0.5, 2.6)) * (1 - inOutCubic(seg(t, b - 0.2, b)));

// ---------- renderer: draw at 2x, downsample into the 1080 output ----------
const BACK = 1;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(2);
renderer.setSize(SIZE, SIZE, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const out = document.getElementById('out'), ctx = out.getContext('2d');
ctx.imageSmoothingQuality = 'high';

const scene = new THREE.Scene();
const WALL = new THREE.Color('#fbe7df');
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const tex = (w, h, draw, rx = 1, ry = 1) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.redraw = () => { draw(c.getContext('2d'), w, h); t.needsUpdate = true; }; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8;
  return t;
};

// the town's light recipe
scene.add(new THREE.HemisphereLight(0xfff4ec, 0xf6d3da, 0.62));
const sun = new THREE.DirectionalLight(0xfff0dc, 0.5);
sun.position.set(5, 9, 4);
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 });
sun.shadow.radius = 3; sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffeef2, 0.28); fill.position.set(-2, 1.5, 10); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd6e6, 0.35); rim.position.set(1, 6, -9); scene.add(rim);

const mats = {};
const M = (c, extra) => { const k = c + JSON.stringify(extra || {}); return mats[k] || (mats[k] = new THREE.MeshLambertMaterial({ color: c, ...extra })); };
function mesh(geo, color, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s, cast = true, recv = false, mat } = {}) {
  const m = new THREE.Mesh(geo, mat || M(color));
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  if (s) Array.isArray(s) ? m.scale.set(...s) : m.scale.setScalar(s);
  m.castShadow = cast; m.receiveShadow = recv;
  return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, seg = 32) => new THREE.CylinderGeometry(rt, rb, h, seg);
const sph = (r, seg = 16) => new THREE.SphereGeometry(r, seg, Math.max(6, seg * 0.75 | 0));
const group = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent && parent.add(g); return g; };

// ---------- models arrive later: groups are made now and filled when each file has loaded ----------
const fillers = {};
const whenModel = (name, fn) => (fillers[name] = fillers[name] || []).push(fn);
// a dessert (or any model from the town) inside a group of its own that scenes can move and scale
function holder(name, parent, scale = 1) {
  const g = group(parent); g.scale.setScalar(scale);
  whenModel(name, () => g.add(makeScenery(name).g));
  return g;
}
const chars = [];
function newChar(sp, parent, { scale = 1.45, slice = false } = {}) {
  const hop = group(parent);
  const c = { sp, hop, scale, slice, m: null, phase: hash(chars.length + 3, 5) };
  chars.push(c);
  whenModel(sp, () => {
    const m = makeModel(sp, COLORS[sp]); m.g.scale.setScalar(scale); hop.add(m.g);
    const mixer = new THREE.AnimationMixer(m.g), act = n => { const cl = m.clips.find(x => x.name === n); if (!cl) return null; const a = mixer.clipAction(cl); a.play(); return a; };
    Object.assign(c, { m, mixer, idle: act('idle'), blink: act('blink'), walk: act('walk'), sliceNode: m.g.getObjectByName('slice') });
  });
  return c;
}
// idle sways and blinks, or a walk cycle, all set from the time so frames never depend on each other
function poseChar(c, t, walking = false, wphase = 0) {
  if (!c.m) return;
  if (c.idle) { c.idle.enabled = !walking; c.idle.time = ((t / 3.5 + c.phase) % 1) * c.idle.getClip().duration; }
  if (c.walk) { c.walk.enabled = walking; c.walk.time = (((wphase % 1) + 1) % 1) * c.walk.getClip().duration; }
  if (c.blink) c.blink.time = ((t / 5.25 + c.phase * 0.8) % 1) * c.blink.getClip().duration;
  c.mixer.update(0);
  if (c.sliceNode) c.sliceNode.visible = c.slice && !walking;
}
// squash and stretch, a hop with a spin, applied to a character's hop group
function hopAnim(c, u, start, { height = 0.62, spin = true } = {}) {
  let y = 0, sy = 1, sxz = 1, ry = 0;
  const s = u - start;
  if (s >= 0 && s < 1.2) {
    const a = seg(s, 0, 0.15), air = seg(s, 0.15, 0.47), land = s - 0.47;
    if (s < 0.15) { sy = 1 - 0.14 * outQuad(a); sxz = 1 + 0.08 * outQuad(a); }
    else if (s < 0.47) { y = height * 4 * air * (1 - air); sy = 1 + 0.12 * (1 - air) * (1 - air) + 0.05 * air * air; sxz = 1 / Math.sqrt(sy); if (spin) ry = TAU * inOutCubic(air); }
    else { const k = 1 - spring(land, 0.35, 3.6); sy = 1 - 0.16 * k; sxz = 1 + 0.09 * k; }
  }
  c.hop.position.y = y; c.hop.rotation.y = ry; c.hop.scale.set(sxz, sy, sxz);
}

// ---------- little sparkles and splashes: a pool of tiny shapes, placed afresh each frame from the time ----------
const POOL = [...Array(160)].map(() => { const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.06), new THREE.MeshBasicMaterial({ color: '#ffe08a', transparent: true })); m.visible = false; scene.add(m); return m; });
let poolUsed = 0;
const tmpV = new THREE.Vector3();
function particle(x, y, z, size, alpha, color) {
  const m = POOL[poolUsed++]; if (!m) return;
  m.visible = true; m.position.set(x, y, z); m.scale.setScalar(size); m.material.opacity = alpha; m.material.color.set(color); m.rotation.y = x * 5 + y * 3;
}
// n shapes thrown out from `origin` at time `te`, each with its own steady direction
function burst(t, te, origin, n, key, { spread = 2.2, up = 1.8, life = 0.8, colors = ['#ffe08a', '#ffffff', '#ffb3c6'], size = 1, grav = 3 } = {}) {
  const a = t - te; if (a < 0 || a > life) return;
  for (let i = 0; i < n; i++) {
    const ang = hash(key, i * 3 + 1) * TAU, sp = spread * (0.4 + hash(key, i * 3 + 2) * 0.6), v = up * (0.6 + hash(key, i * 3 + 3) * 0.8);
    particle(origin.x + Math.cos(ang) * sp * a, origin.y + Math.max(v * a - 0.5 * grav * a * a, -0.15), origin.z + Math.sin(ang) * sp * a * 0.6, (0.9 * (1 - a / life) + 0.25) * size, 1 - a / life, colors[i % colors.length]);
  }
}
// soft round shadow blobs for scenes that have no real shadows
const blobTex = tex(64, 64, (g, w) => { const r = g.createRadialGradient(w / 2, w / 2, 2, w / 2, w / 2, w / 2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.55, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });
const blobMat = new THREE.MeshBasicMaterial({ map: blobTex, color: '#7a4a63', transparent: true, opacity: 0.32, depthWrite: false });
const blobGeo = new THREE.PlaneGeometry(2, 2).rotateX(-PI / 2);
const blob = (parent, x, y, z, rx, rz = rx) => { const b = new THREE.Mesh(blobGeo, blobMat); b.position.set(x, y + 0.02, z); b.scale.set(rx, 1, rz); parent.add(b); return b; };

// ---------- wallpaper, the window view and the chalkboard: pictures drawn here ----------
const paper = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#fff6ea'; g.fillRect(0, 0, w, h); g.fillStyle = '#ffe6ea'; g.fillRect(0, 0, w / 2, h); g.fillStyle = '#f9c6d2';
  const heart = (x, y, r) => { g.beginPath(); g.moveTo(x, y + r * 0.9); g.bezierCurveTo(x - r * 1.6, y - r * 0.3, x - r * 0.5, y - r * 1.3, x, y - r * 0.4); g.bezierCurveTo(x + r * 0.5, y - r * 1.3, x + r * 1.6, y - r * 0.3, x, y + r * 0.9); g.fill(); };
  heart(w * 0.75, h * 0.25, 12); heart(w * 0.75, h * 0.75, 12);
}, 12, 7);
const tile = tex(64, 64, (g) => { g.fillStyle = '#ffeedd'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#ffbfd2'; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32); });
const view = tex(256, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#ffc6d6'); gr.addColorStop(1, '#ffe9c9'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,0.85)';
  [[60, 80, 26], [90, 70, 32], [124, 84, 24], [190, 150, 22], [214, 142, 28]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); });
});
const halo = tex(128, 128, (g, w, h) => { const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); r.addColorStop(0, 'rgba(255,240,200,0.9)'); r.addColorStop(0.35, 'rgba(255,225,180,0.35)'); r.addColorStop(1, 'rgba(255,225,180,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); });
const title = tex(1024, 400, (g, w, h) => {
  g.fillStyle = '#4a3b3f'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#fff6ea'; g.lineWidth = 6; g.setLineDash([18, 14]); g.strokeRect(26, 26, w - 52, h - 52);
  g.fillStyle = '#fff6ea'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '600 118px Fredoka'; g.fillText('Cheesecake Rush', w / 2, h * 0.4);
  g.font = '500 58px Fredoka'; g.fillStyle = '#ffb3c1'; g.fillText('♡ bake · serve · cash up ♡', w / 2, h * 0.74);
});

// ============================================================================================
// the stage for the title and the end card: the shop behind (blurred), the giant cheesecake in front
// ============================================================================================
const gStage = group(scene);
const island = group(gStage), table = group(island);
table.add(mesh(cyl(2.9, 2.9, 0.04, 72), '#fbb8c8', { y: 0.03, recv: true, cast: false }));
whenModel('bigcake', () => island.add(makeScenery('bigcake').g));
const toBack = o => o.traverse(c => { if (!c.userData.sharp) c.layers.set(BACK); });
const shop = group(gStage, 0, 0, -6);
whenModel('shop', () => { const set = makeScenery('shop').g; set.traverse(o => { o.castShadow = false; }); shop.add(set); toBack(shop); });
shop.add(mesh(new THREE.PlaneGeometry(34, 20), null, { y: 4, cast: false, recv: true, mat: new THREE.MeshLambertMaterial({ map: paper }) }));
shop.add(mesh(new THREE.PlaneGeometry(2.24, 2.08), null, { x: -4.3, y: 2.1, z: 0.12, cast: false, mat: new THREE.MeshBasicMaterial({ map: view }) }));
const sign = group(gStage, 0, 0, -6);
const signBoard = mesh(new THREE.PlaneGeometry(5.0, 1.95), null, { x: 0, y: 3.85, z: 0.17, cast: false, mat: new THREE.MeshBasicMaterial({ map: title }) });
sign.add(signBoard);
whenModel('sign', () => { const frame = makeScenery('sign').g; frame.traverse(o => { o.castShadow = false; }); sign.add(frame); });
const glow = new THREE.MeshBasicMaterial({ color: '#fff4c9' });
const lamps = [-3.1, 3.1].map(x => {
  const g = group(gStage, x, 9.3, -3);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: halo, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  s.position.y = -5.05; s.scale.setScalar(1.6); s.layers.set(BACK); g.add(s);
  return g;
});
whenModel('shoplamp', () => lamps.forEach(g => { const l = makeScenery('shoplamp', { bulb: glow }).g; l.traverse(o => { o.castShadow = false; }); g.add(l); }));

// every light shines on both passes (the blurred shop and the sharp front)
scene.traverse(o => { if (o.isLight) o.layers.enableAll(); });

// scene 1: Miw drops in on the cake, and four desserts pop up round her
const heroSeat = group(table), hero = newChar('miw', heroSeat, { slice: true });
const DESSERT_RING = ['cheesecake', 'kittycupcake', 'donut', 'pretzelcake'].map((name, i) => {
  const a = (i - 1.5) * 0.62, g = group(table, Math.sin(a) * 2.0, 0.06, Math.cos(a) * 1.45 - 0.4);
  const inner = holder(name, g, 2.0);
  return { g, inner, i };
});
// scene 5: the seven friends stand round the cake like in the intro
const RING = ['cat', 'bunny', 'bear', 'frog', 'chick', 'penguin', 'miw'].map((sp, i) => {
  const a = i / 7 * TAU, seat = group(table, Math.sin(a) * 2.45, 0.06, Math.cos(a) * 2.45); seat.rotation.y = a;
  return newChar(sp, seat, { slice: true });
});

// ============================================================================================
// scene 2: the kitchen
// ============================================================================================
const gKit = group(scene);
const KIT = { bowl: [-2.6, 0.6, 0.3], oven: [0.7, 0.6, -0.5], plate: [3.5, 0.6, 0.3] };
gKit.add(mesh(box(15, 0.5, 3), '#fff6ef', { y: 0.25 }), mesh(box(15.2, 0.12, 3.2), '#ffc4d6', { y: 0.55 }));
gKit.add(mesh(new THREE.PlaneGeometry(34, 14), null, { y: 4.4, z: -3.0, cast: false, mat: new THREE.MeshLambertMaterial({ map: paper }) }));
gKit.add(mesh(box(34, 0.9, 0.2), '#ffd3e0', { y: 1.15, z: -2.95, cast: false }));
// shelves with jars, a rack of pots, a window
[[-5.6, 3.1], [-5.6, 4.1]].forEach(([x, y]) => gKit.add(mesh(box(2.6, 0.08, 0.5), '#e8b886', { x, y, z: -2.7, cast: false })));
[0, 1].forEach(r => [-0.9, -0.3, 0.3, 0.9].forEach((dx, i) => gKit.add(mesh(cyl(0.17, 0.17, 0.36, 14), ['#ffc4d6', '#cdeee0', '#ffe3a8', '#d9ccf5'][(i + r) % 4], { x: -5.6 + dx, y: 3.34 + r * 1.0, z: -2.7, cast: false }))));
gKit.add(mesh(box(3.4, 0.07, 0.07), '#8a7a80', { x: 1.2, y: 4.6, z: -2.7, cast: false }));
[-1.4, -0.7, 0, 0.7, 1.4].forEach((dx, i) => gKit.add(mesh(cyl(0.26, 0.21, 0.26, 16), '#d98a5a', { x: 1.2 + dx, y: 4.2, z: -2.7, cast: false }), mesh(box(0.05, 0.4, 0.05), '#8a7a80', { x: 1.2 + dx, y: 4.45, z: -2.7, cast: false })));
gKit.add(mesh(box(3.0, 2.5, 0.08), '#ffffff', { x: 6.6, y: 3.6, z: -2.85, cast: false }), mesh(new THREE.PlaneGeometry(2.7, 2.2), null, { x: 6.6, y: 3.6, z: -2.8, cast: false, mat: new THREE.MeshBasicMaterial({ map: view }) }));
// the bowl, a spoon, the batter
const bowlG = group(gKit, ...KIT.bowl);
bowlG.add(mesh(cyl(0.9, 0.62, 0.8, 36), '#ffe1ea', { y: 0.4 }));
const batter = mesh(cyl(0.8, 0.8, 0.05, 36), '#fff6e4', { y: 0.78 }); bowlG.add(batter);
const spoon = group(bowlG, 0, 0.8, 0);
spoon.add(mesh(cyl(0.045, 0.045, 1.3, 8), '#e8b886', { x: 0.65, y: 0.55, rz: -0.5 }), mesh(sph(0.14, 10), '#e8b886', { x: 0.36, y: 0.02, s: [1, 0.5, 1] }));
blob(gKit, KIT.bowl[0], 0.61, KIT.bowl[2], 1.3);
// the oven: a glass door that swings down, a dessert baking behind it
const ovenG = group(gKit, ...KIT.oven);
ovenG.add(mesh(box(2.7, 2.1, 1.7), '#ffc4d6', { y: 1.05 }), mesh(box(2.8, 0.12, 1.8), '#fffaf3', { y: 2.12 }), mesh(box(2.0, 1.25, 0.02), '#7a4630', { y: 0.95, z: 0.86 }));
[-0.65, 0.65].forEach(x => ovenG.add(mesh(sph(0.1, 10), '#ffffff', { x, y: 1.82, z: 0.88 })));
const door = group(ovenG, 0, 0.32, 1.12);
const glass = new THREE.MeshBasicMaterial({ color: '#ffb36b', transparent: true, opacity: 0.5 });
door.add(mesh(box(2.0, 1.25, 0.06), '', { y: 0.62, mat: glass }), mesh(box(2.15, 0.09, 0.1), '#ffffff', { y: 1.27 }));
const ovenCake = holder('cheesefull', ovenG, 1.0); ovenCake.position.set(0, 0.45, 0.98);
const steam = [0, 1, 2, 3].map(() => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true })); ovenG.add(m); return m; });
blob(gKit, KIT.oven[0], 0.61, KIT.oven[2], 1.8);
// the plate: the cake comes out onto it, gets its toppings, and is cut in four
const plateG = group(gKit, ...KIT.plate);
plateG.add(mesh(cyl(1.0, 0.85, 0.08, 36), '#ffffff', { y: 0.04 }));
const plateCake = holder('cheesefull', plateG, 1.6); plateCake.position.y = 0.08;
const slices = [0, 1, 2, 3].map(i => { const g = group(plateG, 0, 0.08, 0); g.add(holder('cheesecake', g, 1.5)); return g; });
blob(gKit, KIT.plate[0], 0.61, KIT.plate[2], 1.4);
const flyCake = holder('cheesefull', gKit, 1.6);
// ingredients and toppings
const INGS = [
  () => mesh(sph(0.13, 10), '#fff6e8', { s: [1, 1.25, 1] }),
  () => mesh(box(0.22, 0.3, 0.12), '#ffffff', { rz: 0.4 }),
  () => { const g = new THREE.Group(); g.add(mesh(sph(0.12, 10), '#ef5470', { s: [1, 1.1, 1] }), mesh(sph(0.06, 6), '#7cc68a', { y: 0.12, s: [1.4, 0.5, 1.4] })); return g; },
].map(f => { const m = f(); m.visible = false; gKit.add(m); return m; });
const TOPS = [
  () => { const g = new THREE.Group(); g.add(mesh(sph(0.13, 10), '#ef5470', { s: [1, 1.1, 1] }), mesh(sph(0.065, 6), '#7cc68a', { y: 0.13, s: [1.4, 0.5, 1.4] })); return g; },
  () => mesh(sph(0.11, 10), '#6b3a2a', { s: [1.5, 0.5, 1.1] }),
  () => mesh(new THREE.OctahedronGeometry(0.12), '#ffe08a'),
].map(f => { const m = f(); m.visible = false; plateG.add(m); return m; });
const chefSeat = group(gKit), chef = newChar('miw', chefSeat, { scale: 1.25 });

// ============================================================================================
// scene 3: the café: three friends at their tables, Miw serving
// ============================================================================================
const gCafe = group(scene);

  } else if (si === 2) {

// ---------- the soundtrack: the same cosy music box, and a sound for every move ----------
const BAR = 1.5;
const CHORDS = [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50], [48, 52, 55], [41, 45, 48], [43, 47, 50]];
const TUNE = [[72, 76, 79, 76], [72, 76, 81, 79], [77, 76, 72, 69], [74, 79, 77, 74], [76, 79, 84, 79], [77, 81, 79, 77], [74, 79, 76, 74]];
const AUDIO_LEN = DUR + 2.5;   // room for the last bell to ring out
function score() {
  const ev = [], add = (at, sound, o = {}) => ev.push({ at, sound, ...o });
  for (let b = 0; b * BAR < DUR; b++) {
    const t0 = b * BAR, ch = CHORDS[b % 7], tu = TUNE[b % 7];
    add(t0, 'pad', { notes: ch.map(n => n + 12), dur: BAR }); add(t0, 'bass', { note: ch[0] - 12 }); add(t0 + BAR / 2, 'bass', { note: ch[0] - 12, gain: 0.12 });
    tu.forEach((n, k) => add(t0 + k * BAR / 4, 'musicbox', { note: n, pan: k % 2 ? 0.25 : -0.25 }));
  }
  const S = TL, at = (s, u) => S[s][0] + u + F1;
  // 1. title
  add(F1, 'bell'); add(at('s1', 0.35), 'whoosh', { dur: 0.5 }); add(at('s1', 0.62), 'thump'); add(at('s1', 0.62), 'boing', { gain: 0.1 });
  [0.95, 1.17, 1.39, 1.61].forEach((a, i) => { add(at('s1', a), 'pop', { pan: -0.4 + i * 0.27 }); add(at('s1', a + 0.05), 'tick', { note: [84, 88, 91, 96][i] }); });
  add(at('s1', 1.8), 'boing'); add(at('s1', 2.27), 'thump', { gain: 0.3 });
  // 2. bake
  [0.3, 0.6, 0.9].forEach((a, i) => { add(at('s2', a + 0.5), 'pop', { gain: 0.2 }); add(at('s2', a + 0.5), 'tick', { note: [84, 88, 91][i], gain: 0.08 }); });
  [1.5, 1.88, 2.26].forEach(a => add(at('s2', a), 'whoosh', { dur: 0.42, gain: 0.06 }));
  [1.45, 3.25, 5.35].forEach((a, i) => add(at('s2', a), 'pop', { gain: 0.16, pan: -0.2 + i * 0.2 }));
  add(at('s2', 2.8), 'whoosh', { dur: 0.5 });
  add(at('s2', 4.4), 'bell', { gain: 0.14, pan: 0.1 }); add(at('s2', 4.45), 'boing', { gain: 0.14 });
  add(at('s2', 4.55), 'whoosh', { dur: 0.6, gain: 0.06 }); add(at('s2', 5.3), 'thump');
  [5.8, 6.0, 6.2].forEach((a, i) => add(at('s2', a), 'tick', { note: [88, 91, 96][i], gain: 0.1 }));
  add(at('s2', 6.5), 'whoosh', { dur: 0.4 }); add(at('s2', 6.52), 'boing', { gain: 0.16 });
  [0, 1, 2, 3].forEach(i => add(at('s2', 6.56 + i * 0.07), 'tick', { note: [91, 95, 98, 103][i], gain: 0.09, pan: -0.4 + i * 0.27 }));
  // 3. serve
  [0.15, 0.27, 0.39].forEach((a, i) => add(at('s3', a), 'pop', { gain: 0.18, pan: -0.4 + i * 0.4 }));
  [1.0, 1.95, 2.85].forEach((a, i) => {
    add(at('s3', a + 0.3), 'boing', { gain: 0.15, pan: -0.4 + i * 0.4 }); add(at('s3', a + 0.35), 'tick', { note: 88, gain: 0.1 }); add(at('s3', a + 0.42), 'tick', { note: 95, gain: 0.1 });
    add(at('s3', a + 0.5), 'thump', { gain: 0.2 });
  });
  add(at('s3', 3.15), 'boing', { gain: 0.12 });
  // 4. cash up
  add(at('s4', 0.05), 'whoosh', { dur: 0.5 }); add(at('s4', 0.55), 'thump', { gain: 0.2 });
  add(at('s4', 0.95), 'tick', { note: 84, gain: 0.12 }); add(at('s4', 1.3), 'tick', { note: 88, gain: 0.12 });
  add(at('s4', 1.95), 'pop', { gain: 0.28 }); add(at('s4', 1.98), 'bell', { gain: 0.1, pan: 0 });
  for (let i = 0; i < 12; i++) add(at('s4', 2.05 + hash(i, 12) * 0.9), 'tick', { note: 88 + (i * 5) % 12, gain: 0.08, pan: hash(i, 13) - 0.5 });
  add(at('s4', 2.05), 'boing', { gain: 0.14 }); add(at('s4', 2.15), 'boing', { gain: 0.12 });
  // 5. the end card
  for (let i = 0; i < 7; i++) { add(at('s5', 0.15 + 0.28 * i + 0.15), 'boing', { gain: 0.14, pan: -0.5 + i / 6 }); add(at('s5', 0.15 + 0.28 * i + 0.47), 'thump', { gain: 0.22 }); }
  add(at('s5', 1.5), 'pop', { gain: 0.28 });

  add(at('s5', 2.2), 'bell', { gain: 0.12 });

}

// ---------- play, freeze (?t=), capture (?capture) or render the soundtrack (?audio) ----------
const q = new URLSearchParams(location.search);
Object.keys(fillers).forEach(n => loadModel(n, () => fillers[n].forEach(f => f())));
whenModelsLoaded(() => document.fonts.load('600 58px Fredoka').then(() => document.fonts.load('500 50px Fredoka')).then(() => document.fonts.load('600 120px Fredoka')).then(async () => {
  title.redraw(); makeThumbs();
  window.__ready = true;
  if (q.has('t')) return renderAt(parseFloat(q.get('t')) || 0);
  if (q.has('audio')) {
    await fetch('audio/rush', { method: 'POST', body: await renderLoop(score(), AUDIO_LEN) });
    window.__audio = true; document.title = 'audio saved';
    return;
  }
  if (q.has('capture')) {
    for (let f = 0; f < FRAMES; f++) {
      renderAt(f / FPS);
      const png = await new Promise(r => out.toBlob(r, 'image/png'));
      await fetch(`frame/rush/${String(f).padStart(4, '0')}`, { method: 'POST', body: png });
      document.title = `${f + 1}/${FRAMES}`;
    }
    window.__captured = FRAMES;
    return;
  }
  const t0 = performance.now();
  (function tick() { renderAt(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(tick); })();
}), 20000);
